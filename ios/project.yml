name: NYCCulture
options:
  bundleIdPrefix: com.smvcmd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NYCCulture:
    type: application
    platform: iOS
    sources:
      - path: NYCCulture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smvcmd.nycculture
        PRODUCT_NAME: NYCCulture
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: NYC Culture
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Shows where you are on the map so you can find nearby exhibitions and events.
schemes:
  NYCCulture:
    build:
      targets:
        NYCCulture: all
    run:
      config: Debug
